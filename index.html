<!DOCTYPE html>
<html lang="it">
<head> <link rel="apple-touch-icon" href="icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mia scheda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eceffd;--card:#fff;--tx:#0e1330;--mu:#6a7094;--ac:#3d5afe;--bd:#dde1f5;--hero:#0e1330;--pl:#ffd23f;--ok:#12a150;--no:#e03131}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080b1e;--card:#131838;--tx:#eef0ff;--mu:#8b92bd;--ac:#7189ff;--bd:#232a58;--hero:#1b2257;--ok:#4cd98a;--no:#ff7676}}
:root[data-theme="dark"]{--bg:#080b1e;--card:#131838;--tx:#eef0ff;--mu:#8b92bd;--ac:#7189ff;--bd:#232a58;--hero:#1b2257;--ok:#4cd98a;--no:#ff7676}
*{box-sizing:border-box}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Barlow',system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:12px 12px 40px}
.hero{background:var(--hero);color:#f2f4ff;border-radius:28px;padding:24px 20px 18px;margin-bottom:16px}
h1{font:800 clamp(42px,13vw,60px)/.95 'Barlow Condensed','Arial Narrow',Impact,sans-serif;margin:0 0 10px;outline:none;border-bottom:2px dashed transparent;padding-bottom:4px}
h1:focus{border-bottom-color:var(--pl)}
.sub{color:rgba(242,244,255,.72);font-size:15px;font-weight:600;margin-bottom:14px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:var(--pl);border-radius:3px;transition:width .4s}
.main{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.1);border-radius:14px}
.main button{flex:1;padding:11px;border:0;border-radius:10px;background:transparent;color:rgba(242,244,255,.7);font:600 16px 'Barlow',sans-serif}
.main button.on{background:#f2f4ff;color:#0e1330}
.tabs{display:flex;gap:8px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;padding:10px 18px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;font:600 15px 'Barlow',sans-serif}
.tabs button.on{background:var(--tx);border-color:var(--tx);color:var(--bg)}
.ex{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 10px 12px 16px;margin-bottom:10px}
.ex input[type=checkbox]{-webkit-appearance:none;appearance:none;width:28px;height:28px;border:2px solid var(--bd);border-radius:50%;flex:none;display:grid;place-items:center;margin:0;background:transparent}
.ex input[type=checkbox]:checked{background:var(--ac);border-color:var(--ac)}
.ex input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.t{flex:1;min-width:0}
.n{font:700 22px/1.1 'Barlow Condensed','Arial Narrow',sans-serif;outline:none}
.s{color:var(--mu);font-size:14px;font-weight:500;margin-top:3px;outline:none}
.ex.done{opacity:.55}
.ex.done .n{text-decoration:line-through}
.kg{position:relative;flex:none}
.kg input{width:68px;height:68px;border:0;border-radius:50%;background:var(--pl);color:#0e1330;font:800 25px 'Barlow Condensed',sans-serif;text-align:center;padding:0 0 11px;box-shadow:inset 0 0 0 5px var(--pl),inset 0 0 0 7px rgba(14,19,48,.28);-moz-appearance:textfield}
.kg input::-webkit-outer-spin-button,.kg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.kg input::placeholder{color:rgba(14,19,48,.35)}
.kg span{position:absolute;left:0;right:0;bottom:13px;text-align:center;font:700 10px 'Barlow',sans-serif;color:rgba(14,19,48,.6);pointer-events:none}
.x{background:none;border:none;color:var(--mu);font-size:22px;padding:6px}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;padding:14px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:600 16px 'Barlow',sans-serif}
.row .p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.hint{color:var(--mu);font-size:13px;margin-top:16px;text-align:center}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hd b{font:700 22px 'Barlow Condensed','Arial Narrow',sans-serif}
.big{font:800 36px/1 'Barlow Condensed','Arial Narrow',sans-serif}
.dl{font-size:13px;font-weight:600;color:var(--mu)}
.dl.up{color:var(--ok)}
.dl.dn{color:var(--no)}
svg{width:100%;height:56px;margin:10px 0 6px;display:block}
.h{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-top:1px solid var(--bd);color:var(--mu)}
.h b{color:var(--tx)}
.empty{color:var(--mu);text-align:center;padding:36px 10px}
.p2{background:var(--tx)!important;color:var(--bg)!important;border-color:var(--tx)!important}
.eff{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.eff button{padding:10px 2px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font:700 20px 'Barlow Condensed',sans-serif}
.eff small{display:block;font:500 10px 'Barlow',sans-serif;color:var(--mu)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border-radius:18px;padding:12px 6px;text-align:center}
.sum b{display:block;font:800 34px/1 'Barlow Condensed',sans-serif}
.sum span{font-size:12px;color:var(--mu);font-weight:600}
.wk{display:flex;justify-content:space-between;background:var(--card);border-radius:22px;padding:14px 14px 16px;margin-bottom:12px}
.wk div{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.wk i{display:block;width:32px;height:32px;border-radius:50%;margin-top:6px;border:2px solid var(--bd)}
.wk i.on{background:var(--ac);border-color:var(--ac)}
.wk i.td{border-color:var(--tx)}
.ss{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 8px 12px 14px;margin-bottom:10px}
.ss .t b{display:block;font:700 21px 'Barlow Condensed','Arial Narrow',sans-serif;text-transform:capitalize}
.ss .t span{font-size:14px;color:var(--mu);font-weight:500}
.sc{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font:800 25px 'Barlow Condensed',sans-serif;border:4px solid var(--ac)}
.sc.g1{border-color:var(--ok)}.sc.g3{border-color:var(--pl)}.sc.g4{border-color:var(--no)}
.how{font-size:14px;color:var(--mu);line-height:1.5}
.how b{color:var(--tx)}
.hero{position:relative}
h1{padding-right:46px}
.gear{position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#f2f4ff;font-size:19px}
main{padding-bottom:110px}
.xc{display:block;padding:14px 12px 12px 16px}
.xh{display:flex;align-items:center;gap:6px}
.chev{background:none;border:0;color:var(--mu);font-size:18px;padding:6px 8px}
.xb{margin-top:12px;border-top:1px solid var(--bd);padding-top:10px}
.st{display:flex;align-items:center;gap:8px;padding:5px 0}
.st b{width:18px;color:var(--mu);font:700 16px 'Barlow Condensed',sans-serif}
.st span,.ctl span{color:var(--mu);font-size:13px}
.st input[type=checkbox]{margin-left:auto}
.in{width:70px;padding:9px 6px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:700 17px 'Barlow',sans-serif;text-align:center}
.ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.ctl button{padding:9px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:600 14px 'Barlow',sans-serif}
.ctl .pb{background:var(--ac);border-color:var(--ac);color:#fff}
textarea.in{display:block;width:100%;text-align:left;font:500 14px 'Barlow',sans-serif;margin-top:10px;min-height:56px}
.days .in{flex:1;width:auto;text-align:left}
.msg{font-size:13px;color:var(--mu);margin-top:8px}
#tm{position:fixed;left:12px;right:84px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:6px;padding:10px 12px 10px 16px;border-radius:20px;background:var(--hero);color:#f2f4ff;z-index:5}
#tm.go{background:var(--ok);color:#06210f}
#tmt{font:800 30px 'Barlow Condensed',sans-serif;flex:1}
#tm button{border:0;border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.2);color:inherit;font:700 14px 'Barlow',sans-serif}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:var(--pl);color:#0e1330;font-size:24px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calh b{font:700 23px 'Barlow Condensed',sans-serif;text-transform:capitalize}
.calh button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px}
.calh button:disabled{opacity:.3}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cg span{text-align:center;font-size:12px;font-weight:700;color:var(--mu)}
.cg .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--tx);font:700 14px 'Barlow',sans-serif}
.cg .c.td{box-shadow:inset 0 0 0 2px var(--tx)}
.cg .c.g1{background:var(--ok);color:#06210f}
.cg .c.g2{background:var(--ac);color:#fff}
.cg .c.g3{background:var(--pl);color:#0e1330}
.cg .c.g4{background:var(--no);color:#fff}
.lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mu)}
.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;text-decoration:none}
</style>
</head>
<body>
<main>
<header class="hero"><button class="gear" id="gear" aria-label="Impostazioni">⚙</button><h1 id="ttl" contenteditable="true" spellcheck="false" enterkeyhint="done"></h1>
<div class="sub" id="prog"></div>
<div class="bar"><i id="bi"></i></div>
<div class="main"><button id="vs">Scheda</button><button id="vp">Progressi</button><button id="vd">Diario</button></div></header>
<div id="sv">
 <div class="tabs" id="tabs"></div>
 <div id="list"></div>
 <div class="row"><button class="p" id="add">+ Esercizio</button><button id="reset">Azzera spunte</button></div>
 <div class="row"><button id="fin" class="p2">Termina allenamento</button></div><div class="card" id="fp" style="display:none;margin-top:12px"></div>
 <div class="hint">Tocca titolo, nomi e serie per modificarli. Cambia i kg: l'aggiornamento finisce in Progressi.</div>
</div>
<div id="pv" style="display:none"></div>
<div id="dv" style="display:none"></div>
<div id="wv" style="display:none"></div>
<div id="iv" style="display:none"></div>
</main>
<div id="tm"><span id="tmt"></span><button id="t1">−15</button><button id="t2">+15</button><button id="t3">✕</button></div>
<button id="fab" aria-label="Peso corporeo">⚖️</button>
<script>
var KEY="scheda-v2";
function uid(){return Math.random().toString(36).slice(2,9)}
var DEF={
 "Giorno A · Petto/Spalle":[["Panca piana","4×8 · rec 90s"],["Panca inclinata manubri","3×10 · rec 90s"],["Military press","3×10 · rec 90s"],["Alzate laterali","3×15 · rec 60s"],["Push-down tricipiti","3×12 · rec 60s"]],
 "Giorno B · Schiena/Bicipiti":[["Trazioni / Lat machine","4×8 · rec 90s"],["Rematore bilanciere","4×8 · rec 90s"],["Pulley basso","3×12 · rec 60s"],["Face pull","3×15 · rec 60s"],["Curl manubri","3×12 · rec 60s"]],
 "Giorno C · Gambe":[["Squat","4×8 · rec 120s"],["Leg press","3×12 · rec 90s"],["Stacchi rumeni","3×10 · rec 90s"],["Leg curl","3×12 · rec 60s"],["Calf raise","4×15 · rec 45s"]]
};
function ld(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
var S=ld(KEY);
if(!S||!S.days){
 var old=ld("scheda-v1");
 S={days:{},day:Object.keys(DEF)[0],hist:[],view:"s"};
 if(old&&old.days){for(var k in old.days)S.days[k]=old.days[k].map(function(e){return{id:uid(),n:e.n,s:e.s,d:e.d,kg:""}})}
 else{for(var k in DEF)S.days[k]=DEF[k].map(function(e){return{id:uid(),n:e[0],s:e[1],d:false,kg:""}})}
 S.day=Object.keys(S.days)[0];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function f(n){return String(Math.round(n*100)/100).replace(".",",")}
function log(e,kg){var h=S.hist,last=null,k=lk(new Date());for(var i=h.length-1;i>=0;i--){if(h[i].id===e.id){last=h[i];break}}if(last&&lk(new Date(last.t))===k){last.kg=kg;last.n=e.n}else h.push({id:e.id,n:e.n,kg:kg,t:new Date().toISOString()})}

function nameOf(id,fb){for(var k in S.days){for(var i=0;i<S.days[k].length;i++){if(S.days[k][i].id===id)return S.days[k][i].n}}return fb}
function renderP(){
 var P=document.getElementById("pv");P.innerHTML="";
 document.getElementById("prog").textContent="Storico carichi";document.getElementById("bi").style.width="0%";
 var g={},order=[];
 S.hist.forEach(function(h){if(!g[h.id]){g[h.id]=[];order.push(h.id)}g[h.id].push(h)});
 if(!order.length){P.innerHTML='<div class="empty">Ancora nessun carico registrato.<br>Inserisci i kg nella scheda e compariranno qui.</div>';return}
 order.forEach(function(id){
  var a=g[id],first=a[0].kg,cur=a[a.length-1].kg,d=cur-first;
  var c=document.createElement("div");c.className="card";
  var dl=a.length>1?'<span class="dl '+(d>0?"up":d<0?"dn":"")+'">'+(d>0?"+":"")+f(d)+" kg dall'inizio</span>":'<span class="dl">primo carico</span>';
  var html='<div class="hd"><b>'+nameOf(id,a[a.length-1].n).replace(/</g,"&lt;")+'</b><span class="big">'+f(cur)+' kg</span></div><div>'+dl+'</div>';
  if(a.length>1){
   var mn=Math.min.apply(null,a.map(function(h){return h.kg})),mx=Math.max.apply(null,a.map(function(h){return h.kg})),rg=(mx-mn)||1;
   var pts=a.map(function(h,i){return(4+i*(292/(a.length-1))).toFixed(1)+","+(46-((h.kg-mn)/rg)*40).toFixed(1)}).join(" ");
   html+='<svg viewBox="0 0 300 50" preserveAspectRatio="none"><polyline points="'+pts+'" fill="none" stroke="var(--ac)" stroke-width="2.5" vector-effect="non-scaling-stroke"/></svg>';
  }
  for(var i=a.length-1;i>=0;i--){
   var dt=new Date(a[i].t).toLocaleDateString("it-IT",{day:"numeric",month:"short",year:"numeric"});
   var df=i>0?a[i].kg-a[i-1].kg:0;
   html+='<div class="h"><span>'+dt+'</span><b>'+f(a[i].kg)+' kg'+(i>0?' <span class="dl '+(df>0?"up":df<0?"dn":"")+'">('+(df>0?"+":"")+f(df)+')</span>':"")+'</b></div>';
  }
  c.innerHTML=html;P.appendChild(c);
 });
}
document.getElementById("add").onclick=function(){var e=mk("Nuovo esercizio",3,10);e.open=true;S.days[S.day].push(e);save();render()};
document.getElementById("reset").onclick=function(){S.days[S.day].forEach(clr);save();render()};
document.getElementById("vs").onclick=function(){show("s")};
document.getElementById("vp").onclick=function(){show("p")};
if(!S.log)S.log=[];
var EFF=[0,6,12,17,20,18],EL=["","Molto leggero","Leggero","Giusto","Duro","Al limite"],GN=["","Ottimo","Buono","Discreto","Da migliorare"];
function gr(n){return n>=85?1:n>=70?2:n>=50?3:4}
function lk(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate()}
function upToday(){var d=lk(new Date());return S.hist.some(function(h,i){if(lk(new Date(h.t))!==d)return false;for(var j=i-1;j>=0;j--){if(S.hist[j].id===h.id)return h.kg>S.hist[j].kg}return false})}
var fp=document.getElementById("fp");
document.getElementById("fin").onclick=function(){
 var n=S.days[S.day].reduce(function(a,e){return a+e.sets.filter(function(s){return s.d}).length},0);
 fp.style.display="block";
 if(!n){fp.innerHTML="<b>Spunta almeno una serie prima di chiudere.</b>";return}
 fp.innerHTML="<b>Com'è stato lo sforzo?</b>";
 var g=document.createElement("div");g.className="eff";
 for(var i=1;i<=5;i++)(function(i){var b=document.createElement("button");b.innerHTML=i+"<small>"+EL[i]+"</small>";b.onclick=function(){endS(i)};g.appendChild(b)})(i);
 fp.appendChild(g)};
function endS(eff){
 var a=S.days[S.day],ds=0,ts=0,dn=0,wk=0,kg=0;
 a.forEach(function(e){var x=e.sets.filter(function(s){return s.d}).length;ts+=e.sets.length;ds+=x;if(e.d)dn++;if(x){wk++;if(e.kg>0)kg++}});
 var up=upToday(),sc=Math.round(ds/ts*60+kg/wk*10+(up?10:0)+EFF[eff]);
 S.log.push({t:new Date().toISOString(),day:S.day.split(" · ")[0],done:dn,tot:a.length,ds:ds,ts:ts,eff:eff,sc:sc,up:up});
 a.forEach(clr);fp.style.display="none";save();show("d")}
var CM=null;
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function renderD(){
 var D=document.getElementById("dv");D.innerHTML="";
 document.getElementById("prog").textContent="Diario allenamenti";
 document.getElementById("bi").style.width="0%";
 var L=S.log,now=new Date(),dow=(now.getDay()+6)%7,wk=0,tot=0,by={},i;
 if(!CM)CM={y:now.getFullYear(),m:now.getMonth()};
 L.forEach(function(l){tot+=l.sc;var k=lk(new Date(l.t));(by[k]=by[k]||[]).push(l)});
 for(i=0;i<7;i++){if(by[lk(new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow+i))])wk++}
 var sm=el("div","sum");
 sm.innerHTML='<div><b>'+wk+'/'+(S.goal||3)+'</b><span>giorni questa settimana</span></div><div><b>'+L.length+'</b><span>allenamenti</span></div><div><b>'+(L.length?Math.round(tot/L.length):"–")+'</b><span>qualità media</span></div>';
 D.appendChild(sm);
 var cc=el("div","card"),hd=el("div","calh"),pv=el("button","","‹"),nx=el("button","","›");
 hd.appendChild(pv);hd.appendChild(el("b","",new Date(CM.y,CM.m,1).toLocaleDateString("it-IT",{month:"long",year:"numeric"})));hd.appendChild(nx);
 nx.disabled=CM.y===now.getFullYear()&&CM.m===now.getMonth();
 pv.onclick=function(){CM.m--;if(CM.m<0){CM.m=11;CM.y--}renderD()};
 nx.onclick=function(){CM.m++;if(CM.m>11){CM.m=0;CM.y++}renderD()};
 cc.appendChild(hd);
 var g=el("div","cg"),det=el("div","msg","Tocca un giorno colorato per vedere i dettagli."),off=(new Date(CM.y,CM.m,1).getDay()+6)%7,nd=new Date(CM.y,CM.m+1,0).getDate();
 ["L","M","M","G","V","S","D"].forEach(function(x){g.appendChild(el("span","",x))});
 for(i=0;i<off;i++)g.appendChild(el("span"));
 for(i=1;i<=nd;i++)(function(d){
  var dt=new Date(CM.y,CM.m,d),k=lk(dt),a=by[k],c;
  if(a){c=el("button","c g"+gr(Math.max.apply(null,a.map(function(l){return l.sc}))),d);
   c.onclick=function(){det.textContent=dt.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"})+": "+a.map(function(l){return l.day+", "+l.sc+" punti ("+GN[gr(l.sc)]+")"}).join(" · ")}}
  else c=el("div","c",d);
  if(k===lk(now))c.className+=" td";
  g.appendChild(c)})(i);
 cc.appendChild(g);
 var lg=el("div","lg");lg.innerHTML='<span><u style="background:var(--ok)"></u>Ottimo</span><span><u style="background:var(--ac)"></u>Buono</span><span><u style="background:var(--pl)"></u>Discreto</span><span><u style="background:var(--no)"></u>Da migliorare</span>';
 cc.appendChild(lg);cc.appendChild(det);D.appendChild(cc);
 if(!L.length){D.appendChild(el("div","empty","Nessun allenamento registrato. Finito in palestra, premi «Termina allenamento» nella scheda."))}
 for(i=L.length-1;i>=0;i--)(function(i){
  var l=L[i],q=gr(l.sc),r=el("div","ss"),dt=new Date(l.t).toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
